name: CamBridge Windows Native MVP

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/native-mvp/**'
      - 'vcpkg.json'
      - 'docs/validation/native-mvp-synthetic.md'
      - '.github/workflows/windows-native-mvp.yml'
  pull_request:
    paths:
      - 'windows/native-mvp/**'
      - 'docs/validation/native-mvp-synthetic.md'
      - '.github/workflows/windows-native-mvp.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    # Keep the native CMake/Visual Studio generator on the stable runner image.
    # Live Frame Server and camera enumeration remain host-only acceptance tests.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned native dependencies
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cambridge-vcpkg-install.log'
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = 'C:\vcpkg' }
          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            $resolved = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
            if ($null -ne $resolved) { $vcpkg = $resolved.Source }
          }
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            $visualStudioRoots = @(
              (Join-Path ${env:ProgramFiles} 'Microsoft Visual Studio\2022'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022')
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path -LiteralPath $_) }
            foreach ($visualStudioRoot in $visualStudioRoots) {
              $resolved = Get-ChildItem -LiteralPath $visualStudioRoot -Filter vcpkg.exe -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($null -ne $resolved) {
                $vcpkg = $resolved.FullName
                break
              }
            }
          }
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            "vcpkg executable not found under $vcpkgRoot or PATH" | Set-Content -LiteralPath $log
            Get-Content -LiteralPath $log
            throw "vcpkg executable not found under $vcpkgRoot or PATH"
          }
          "vcpkg path: $vcpkg" | Set-Content -LiteralPath $log
          $resolvedVcpkgRoot = Split-Path -Parent $vcpkg
          "resolved vcpkg root: $resolvedVcpkgRoot" | Tee-Object -FilePath $log -Append
          "CAMBRIDGE_VCPKG_ROOT=$resolvedVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $vcpkg version 2>&1 | Tee-Object -FilePath $log -Append
          $versionExit = $LASTEXITCODE
          "vcpkg version exit: $versionExit" | Tee-Object -FilePath $log -Append
          if ($versionExit -ne 0) { exit $versionExit }
          & $vcpkg install --triplet x64-windows --clean-after-build 2>&1 |
            Tee-Object -FilePath $log -Append
          $installExit = $LASTEXITCODE
          "vcpkg install exit: $installExit" | Tee-Object -FilePath $log -Append
          "vcpkg install exit: $installExit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($installExit -ne 0) { exit $installExit }

      - name: Configure with libdatachannel receiver
        shell: pwsh
        run: |
          $vcpkgRoot = $env:CAMBRIDGE_VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT }
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = 'C:\vcpkg' }
          $toolchain = Join-Path $vcpkgRoot 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $toolchain)) { throw "vcpkg toolchain not found: $toolchain" }
          cmake -S windows/native-mvp -B build/native-mvp -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCAMBRIDGE_ENABLE_LIBDATACHANNEL=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build/native-mvp --config Release --parallel

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build/native-mvp -C Release --output-on-failure

      - name: Upload native build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CamBridge-native-mvp-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/cambridge-vcpkg-install.log
            build/native-mvp/Release/*
          if-no-files-found: warn
