name: CamBridge Windows Native MVP

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/native-mvp/**'
      - 'vcpkg.json'
      - 'docs/validation/native-mvp-synthetic.md'
      - '.github/workflows/windows-native-mvp.yml'
  pull_request:
    paths:
      - 'windows/native-mvp/**'
      - 'docs/validation/native-mvp-synthetic.md'
      - '.github/workflows/windows-native-mvp.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    # Keep the native CMake/Visual Studio generator on the stable runner image.
    # Live Frame Server and camera enumeration remain host-only acceptance tests.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned native dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = 'C:\vcpkg' }
          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            $resolved = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
            if ($null -ne $resolved) { $vcpkg = $resolved.Source }
          }
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "vcpkg executable not found under $vcpkgRoot or PATH"
          }
          & $vcpkg version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg install --triplet x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure with libdatachannel receiver
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = 'C:\vcpkg' }
          $toolchain = Join-Path $vcpkgRoot 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $toolchain)) { throw "vcpkg toolchain not found: $toolchain" }
          cmake -S windows/native-mvp -B build/native-mvp -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCAMBRIDGE_ENABLE_LIBDATACHANNEL=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build/native-mvp --config Release --parallel

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build/native-mvp -C Release --output-on-failure

      - name: Upload native build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CamBridge-native-mvp-${{ github.run_number }}
          path: build/native-mvp/Release/*
          if-no-files-found: warn
