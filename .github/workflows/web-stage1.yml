name: CamBridge Web Stage 1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Web Client unit tests
        working-directory: web/client
        run: npm test

      - name: Run 1080p60 stability unit tests
        working-directory: web/client
        run: node --test tests/stability-test.test.js

      - name: Check Web Client JavaScript syntax
        working-directory: web/client
        run: npm run check

      - name: Check HTTPS server JavaScript syntax
        run: node --check windows/stage1-server/server.mjs

      - name: Validate Stage 1 contract
        shell: pwsh
        run: ./scripts/validate-web-stage1.ps1
